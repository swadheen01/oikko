name: oikko
description: "Oikko - Bangladesh Teachers Association App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.5

  # "Continue with Google" sign-in. Pinned to the 6.x line for the classic
  # signIn()/authentication API; needs the Google provider enabled in Firebase
  # Auth and this app's SHA-1/SHA-256 fingerprints registered (see README).
  google_sign_in: ^6.2.1

  # Supabase — used only for file storage (profile photos), since Firebase
  # Storage now requires the paid Blaze plan even within its free-tier
  # limits. Auth/Firestore/everything else stays on Firebase.
  supabase_flutter: ^2.17.2

  # Meeting reminders. FCM can only deliver a push when something sends it;
  # a "remind me 30 minutes before the meeting" alarm has to be scheduled on
  # the device itself, which is what this does (no server, no Blaze plan).
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # State Management
  provider: ^6.1.2

  # UI / Fonts
  # google_fonts removed: the app now bundles Kalpurush from assets/fonts,
  # and nothing else used the package. It also fetched fonts over the
  # network at runtime, which this app has no reason to do.
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.15

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  # Share/print sheet for the generated finance PDF (statement/summary).
  # Bundles the same `pdf` package already used above.
  printing: ^5.13.4
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# Launcher icons, generated from the app logo.
# Regenerate after changing any of these images with:
#   dart run flutter_launcher_icons
#
# Both are derived from assets/oikko.png, which is white artwork on a blue
# disc sitting on a white page. The white page is dropped and the blue
# becomes the icon background instead, so the icon bleeds blue to every edge
# under any launcher mask shape and no white border can ever appear.
#
# icon_app.png        - opaque blue square, white artwork at 78% (iOS
#                       forbids alpha and rounds the corners itself)
# icon_foreground.png - just the white artwork on transparency, filling the
#                       canvas; the generator's 16% inset lands it on
#                       Android's ~66% adaptive safe zone
flutter_launcher_icons:
  image_path: "assets/icon_app.png"
  android: true
  adaptive_icon_background: "#31ABFC"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon_app.png"
    background_color: "#31ABFC"
    theme_color: "#31ABFC"

flutter:
  uses-material-design: true

  fonts:
    # Kalpurush — the Bengali face the association reads. Not available on
    # Google Fonts, so the .ttf is bundled. Use the Unicode build (~307 KB),
    # NOT the "ANSI" one, which is Bijoy-encoded and renders as gibberish.
    - family: Kalpurush
      fonts:
        - asset: assets/fonts/Kalpurush.ttf

  assets:
    - assets/oikko.png
    # Committee photos shown on the About page + full committee list. The
    # *_cut.png versions have the photo background removed (transparent) so
    # they sit on a clean white circle. first=President, second=General
    # Secretary, third=Joint Gen. Sec., fourth=Organizing Sec., fifth=Joint
    # Organizing Sec.
    - assets/first_cut.png
    - assets/second_cut.png
    - assets/third_cut.png
    - assets/fourth_cut.png
    - assets/fifth_cut.png
    # Face crop of developer.png — the full portrait is head-to-waist, so
    # the original would show mostly shirt once masked into a circle.
    - assets/developer_face.png
    # assets/members_seed.json is deliberately NOT bundled. The roster has
    # already been imported into Firestore, so shipping it would add ~100KB
    # to every install for no reason. The file is kept in the repo as a
    # record of what was imported; re-add this line if it's ever needed again.
